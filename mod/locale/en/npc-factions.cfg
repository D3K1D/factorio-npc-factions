[mod-setting-description]
npc-factions-scenario=factions: every engineer settles on its own, far apart. team: one big biter-free area round spawn, cut into a 3 x 3 grid of plots (384 tiles each). You and a friend share the centre plot, up to 7 engineers take the outer plots, and the last one is a shared team yard. Every plot gets starter ore, and biters never settle inside the area.
npc-factions-show-on-map=Each engineer has a name marker on your map that follows it, and the land around it and its base stays charted for you, as a teammate's would.
npc-factions-holograms=While an engineer builds a blueprint from your packs (or every plan, with "all"), its whole layout stands as a hologram and is filled in piece by piece.
npc-factions-early-robots=Once an engineer makes this science pack by machine, it is given modular armor with a personal roboport, the power for it and 10 construction robots. Its robots then build its plans, rebuilds and clearing from its pockets while it keeps them stocked.
npc-factions-chat=quiet: only wars, treaties, attacks and deaths. normal: also offers, deliveries, greetings and trades, at most one line per engineer per minute. chatty: also research, finished builds and banter. Replies to your own messages are always shown.
npc-factions-start-mode=designed: the companion plans each engineer's factory (its blueprint library, then a main bus toward the rocket) and the engineer builds it with its own materials; needs the companion running. Falls back to the scripted starter camp if no plan arrives within 2 game minutes. scripted: the built-in starter camp and project chain only.
npc-factions-count=Choose 1 to 10 engineers before starting a world (default: 2). Each has a separate force and its own starter inventory.
npc-factions-difficulty=Controls the base planning interval. Engineer variation adjusts individual planning and walking speeds.
npc-factions-variation=0 gives identical pacing and traits; 1 gives larger saved differences in walking, planning, recovery delay and supply preferences. This is behavior configuration, not model training.
npc-factions-adaptation=Controls how quickly engineers reconsider stalled work, retry after problems, and adjust their preferences after outcomes. The middle value preserves normal behavior.
npc-factions-disable-bugs=Use a new test world. Disables future native enemy generation, expansion and evolution. Existing native enemies are removed on first initialization.
npc-factions-test-mode=For automated tests only. The normal setting is none.
npc-factions-factory-growth=In the scripted start, engineers grow the starter camp with built-in factory projects, paid with their own materials. The designed start plans its own growth.
npc-factions-orbital-progression=In the scripted start, continue the built-in project chain toward a first space platform above Nauvis. Requires Space Age for the final stage.
npc-factions-home-spacing=How far apart engineers' homes must be. Default: 768 tiles.
npc-factions-native-starts=For new worlds generated with one native starting point per faction. Engineers arrive near their own assigned point, survey real nearby resources and walk to their camp. The entire roster must have suitable camps. Existing factories are not moved. Leave off for ordinary maps with only the player's starting point.

npc-factions-death-waves=How hard the extra biter waves are on a death world (the team world made with the death-world switch). 0 turns them off, 1 is as designed, 2 sends waves twice as big twice as often, and so on. The nearest nests send them at the team's bases from a few minutes in, growing with evolution and time; the biters' own attacks go on as well.
npc-factions-boost-mining-speed=How much faster an engineer mines by hand than a player (1 is a player's speed, 2 is twice as fast). Players are never changed.
npc-factions-boost-inventory=Extra inventory slots on every engineer (0 is a player's inventory). Lowering it can spill what no longer fits. Players are never changed.
npc-factions-boost-health=How much health an engineer has, as a multiple of a player's (1 is a player's, 2.5 is two and a half times). Players are never changed.
npc-factions-quick-start=Each engineer arrives with a quick start kit, once, at its first spawn: 8 burner mining drills, 8 stone furnaces, 50 iron plates, 20 copper plates, a pistol (or the mods' own first gun) and 50 magazines. Engineers already in the game get none.
npc-factions-quick-start-size=How big the quick start kit is (1 as listed, 2 twice as much; the gun is always one).
npc-factions-hand-crafting-speed=How much faster an engineer crafts by hand than a player (1 is a player's speed). It applies only to items its own machines do not yet stock for it: what its assemblers or belts fill chests with is crafted at a player's speed, and fetched instead. So the boost helps most early on, while everything is made by hand, and fades as its base automates.

[shortcut-name]
npc-teach-blueprint=Engineers

[shortcut-description]
npc-teach-blueprint=Open the engineers' window: where each engineer stands with you and with the others (allied, peace or war), answer an engineer's question with Mark location, show them part of your base, or teach every engineer a blueprint (hold it and click the slot).

[item-name]
npc-mark-location=Mark location
npc-show-area=Show an area

[item-description]
npc-mark-location=Click a spot, in the world or on the map. It answers an engineer that asked where, or leaves a mark engineers can use.
npc-show-area=Drag over part of your base: every engineer copies it into the layouts it knows.

